<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineVerse - Modern Movie Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary-color: #6a11cb;
            --secondary-color: #2575fc;
            --accent-color: #ff2d75;
            --background-dark: #0f0c29;
            --card-bg: rgba(255, 255, 255, 0.1);
            --text-light: #ffffff;
            --text-secondary: #b0b0b0;
            --border-radius: 16px;
            --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            --shadow-glass: 0 8px 32px rgba(0, 0, 0, 0.2);
            --gradient-primary: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            --gradient-accent: linear-gradient(135deg, var(--accent-color), #ff7aa2);
        }

        .dark-theme {
            --bg-primary: #0a0a0f;
            --bg-secondary: #121218;
            --text-primary: #f0f0f5;
            --text-secondary: #a0a0b0;
            --card-bg: rgba(30, 30, 46, 0.6);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        .light-theme {
            --bg-primary: #f5f7ff;
            --bg-secondary: #ffffff;
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --card-bg: rgba(255, 255, 255, 0.8);
            --border-color: rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: var(--transition);
            background-image: radial-gradient(circle at 10% 20%, rgba(106, 17, 203, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(37, 117, 252, 0.1) 0%, transparent 20%);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            margin-bottom: 30px;
            position: relative;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: 600;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 10px rgba(106, 17, 203, 0.3);
        }

        .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            padding: 8px 16px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: var(--transition);
        }

        .theme-toggle:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(106, 17, 203, 0.3);
        }

        .search-container {
            display: flex;
            gap: 15px;
            margin-bottom: 40px;
            position: relative;
        }

        #search {
            flex: 1;
            padding: 16px 24px;
            border-radius: 50px;
            border: 2px solid transparent;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            color: var(--text-primary);
            font-size: 1rem;
            box-shadow: var(--shadow-glass);
            transition: var(--transition);
        }

        #search:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 20px rgba(106, 17, 203, 0.3);
        }

        #search-btn {
            padding: 16px 32px;
            border-radius: 50px;
            border: none;
            background: var(--gradient-primary);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 20px rgba(106, 17, 203, 0.4);
        }

        #search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(106, 17, 203, 0.6);
        }

        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: var(--gradient-primary);
            color: white;
            box-shadow: 0 0 15px rgba(106, 17, 203, 0.4);
        }

        #search-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            margin-top: 30px;
        }

        .movie-item {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            overflow: hidden;
            transition: var(--transition);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-glass);
            position: relative;
            transform: translateY(0);
        }

        .movie-item:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(106, 17, 203, 0.4);
        }

        .movie-poster {
            width: 100%;
            height: 400px;
            object-fit: cover;
            display: block;
        }

        .movie-info {
            padding: 20px;
        }

        .movie-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .movie-meta {
            display: flex;
            justify-content: space-between;
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        .movie-rating {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #ffd700;
            font-weight: 600;
        }

        .movie-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }

        .like-btn,
        .bookmark-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .like-btn:hover,
        .bookmark-btn:hover {
            background: var(--gradient-primary);
            transform: scale(1.1);
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
            font-size: 1.2rem;
            color: var(--text-secondary);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 15px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .error-message,
        .no-movies {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
            font-size: 1.2rem;
        }

        .recommendations {
            margin-top: 50px;
        }

        .section-title {
            font-size: 1.8rem;
            margin-bottom: 25px;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            header {
                flex-direction: column;
                gap: 20px;
            }

            .search-container {
                flex-direction: column;
            }

            #search-btn {
                width: 100%;
            }

            #search-list {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 20px;
            }
        }
    </style>
</head>

<body class="dark-theme">
    <div class="container">
        <header>
            <div class="logo">CINEVERSE</div>
            <button class="theme-toggle" id="theme-toggle">🌙 Light Theme</button>
        </header>

        <div class="search-container">
            <input type="text" id="search" placeholder="Search for movies, actors, directors..."
                aria-label="Search for movies">
            <button id="search-btn">Search</button>
        </div>

        <div class="filters">
            <button class="filter-btn active">All</button>
            <button class="filter-btn">Action</button>
            <button class="filter-btn">Comedy</button>
            <button class="filter-btn">Drama</button>
            <button class="filter-btn">Sci-Fi</button>
            <button class="filter-btn">Horror</button>
            <button class="filter-btn">Romance</button>
        </div>

        <div id="search-list" role="main"></div>

        <section class="recommendations">
            <h2 class="section-title">Recommended For You</h2>
            <div id="recommended-list" class="carousel"></div>
        </section>
    </div>

    <script>
        // Theme toggle functionality
        const themeToggle = document.getElementById('theme-toggle');
        const body = document.body;

        // Check for saved theme preference or respect OS setting
        const savedTheme = localStorage.getItem('theme');
        const prefersDarkScheme = window.matchMedia('(prefers-color-scheme: dark)');

        if (savedTheme === 'light') {
            body.classList.remove('dark-theme');
            body.classList.add('light-theme');
            themeToggle.textContent = '☀️ Dark Theme';
        } else if (savedTheme === 'dark' || prefersDarkScheme.matches) {
            body.classList.remove('light-theme');
            body.classList.add('dark-theme');
            themeToggle.textContent = '🌙 Light Theme';
        }

        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-theme');
            body.classList.toggle('light-theme');

            if (body.classList.contains('dark-theme')) {
                localStorage.setItem('theme', 'dark');
                themeToggle.textContent = '🌙 Light Theme';
            } else {
                localStorage.setItem('theme', 'light');
                themeToggle.textContent = '☀️ Dark Theme';
            }
        });

        // Add hover effects to buttons
        document.querySelectorAll('.filter-btn, .like-btn, .bookmark-btn').forEach(btn => {
            btn.addEventListener('mouseenter', function () {
                this.style.transform = 'scale(1.05)';
            });

            btn.addEventListener('mouseleave', function () {
                this.style.transform = 'scale(1)';
            });
        });
    </script>
    <script src="api.js"></script>
    <script src="movies/view.js"></script>
    <script src="movies/logic.js"></script>
</body>

</html>
