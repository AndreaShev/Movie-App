<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Detail - CineVerse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary-color: #6a11cb;
            --secondary-color: #2575fc;
            --accent-color: #ff2d75;
            --background-dark: #0f0c29;
            --card-bg: rgba(255, 255, 255, 0.1);
            --text-light: #ffffff;
            --text-secondary: #b0b0b0;
            --border-radius: 16px;
            --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            --shadow-glass: 0 8px 32px rgba(0, 0, 0, 0.2);
            --gradient-primary: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            --gradient-accent: linear-gradient(135deg, var(--accent-color), #ff7aa2);
        }

        .dark-theme {
            --bg-primary: #0a0a0f;
            --bg-secondary: #121218;
            --text-primary: #f0f0f5;
            --text-secondary: #a0a0b0;
            --card-bg: rgba(30, 30, 46, 0.6);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        .light-theme {
            --bg-primary: #f5f7ff;
            --bg-secondary: #ffffff;
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --card-bg: rgba(255, 255, 255, 0.8);
            --border-color: rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: var(--transition);
            background-image: radial-gradient(circle at 10% 20%, rgba(106, 17, 203, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(37, 117, 252, 0.1) 0%, transparent 20%);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            margin-bottom: 30px;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 600;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 50px;
            background: var(--card-bg);
            color: var(--text-primary);
            text-decoration: none;
            border: 1px solid var(--border-color);
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }

        .back-link:hover {
            background: var(--gradient-primary);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(106, 17, 203, 0.4);
        }

        .movie-detail {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            overflow: hidden;
            padding: 30px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-glass);
        }

        .movie-header {
            display: flex;
            gap: 40px;
            margin-bottom: 30px;
        }

        .movie-poster {
            width: 350px;
            height: 500px;
            object-fit: cover;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .movie-info {
            flex: 1;
        }

        .movie-title {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .movie-meta {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .meta-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.9rem;
        }

        .ratings {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }

        .rating-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .imdb-rating {
            color: #f5c518;
        }

        .actions {
            display: flex;
            gap: 15px;
            margin: 25px 0;
        }

        .action-btn {
            padding: 12px 24px;
            border-radius: 50px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .watch-btn {
            background: var(--gradient-primary);
            color: white;
            box-shadow: 0 4px 15px rgba(106, 17, 203, 0.4);
        }

        .like-btn,
        .bookmark-btn {
            background: var(--card-bg);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(106, 17, 203, 0.6);
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .detail-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
        }

        .detail-item strong {
            display: block;
            margin-bottom: 5px;
            color: var(--primary-color);
        }

        .plot {
            margin: 30px 0;
        }

        .plot h3 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .plot p {
            line-height: 1.8;
            color: var(--text-secondary);
        }

        .cast-section {
            margin: 40px 0;
        }

        .cast-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .cast-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
        }

        .cast-member {
            text-align: center;
        }

        .cast-photo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 10px;
            border: 2px solid var(--primary-color);
        }

        .reviews-section {
            margin: 40px 0;
        }

        .reviews-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .review-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: var(--border-radius);
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .review-author {
            font-weight: 600;
        }

        .review-rating {
            color: #ffd700;
        }

        .social-share {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .social-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--card-bg);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: var(--transition);
        }

        .social-btn:hover {
            transform: scale(1.1);
            background: var(--gradient-primary);
            color: white;
        }

        .loading,
        .error-container,
        .no-movie {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 768px) {
            .movie-header {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            .movie-poster {
                width: 250px;
                height: 350px;
            }

            .movie-title {
                font-size: 2rem;
            }

            .actions {
                flex-direction: column;
            }

            .container {
                padding: 15px;
            }
        }
    </style>
</head>

<body class="dark-theme">
    <div class="container">
        <header>
            <div class="logo">CINEVERSE</div>
            <a href="index.html" class="back-link">← Back to Search</a>
        </header>

        <main id="movie" role="main">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading movie details...</p>
            </div>
        </main>

        <section class="social-share">
            <button class="social-btn">f</button>
            <button class="social-btn">t</button>
            <button class="social-btn">in</button>
            <button class="social-btn">share</button>
        </section>
    </div>

    <script>
        // Theme handling
        const body = document.body;
        const savedTheme = localStorage.getItem('theme');
        const prefersDarkScheme = window.matchMedia('(prefers-color-scheme: dark)');

        if (savedTheme === 'light') {
            body.classList.remove('dark-theme');
            body.classList.add('light-theme');
        } else if (savedTheme === 'dark' || prefersDarkScheme.matches) {
            body.classList.remove('light-theme');
            body.classList.add('dark-theme');
        }

        // Add hover effects to buttons
        document.querySelectorAll('.action-btn, .social-btn').forEach(btn => {
            btn.addEventListener('mouseenter', function () {
                this.style.transform = 'scale(1.05)';
            });

            btn.addEventListener('mouseleave', function () {
                this.style.transform = 'scale(1)';
            });
        });
    </script>
    <script src="api.js"></script>
    <script src="movie/view.js"></script>
    <script src="movie/logic.js"></script>
</body>

</html>
